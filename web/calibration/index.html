<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>fitra-cam calibration</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>Calibration</h1>
      <p id="status">loading</p>
    </div>
    <div class="actions">
      <button id="pointModeBtn" type="button">Point</button>
      <button id="gridModeBtn" type="button">Grid</button>
      <button id="fitGridBtn" type="button">Fit grid</button>
      <button id="saveBtn" type="button">Save</button>
      <button id="solveBtn" type="button">Solve</button>
    </div>
  </header>
  <main>
    <aside>
      <h2>Points</h2>
      <div id="pointList"></div>
      <h2>Quality</h2>
      <pre id="quality">{}</pre>
    </aside>
    <section id="cameraGrid"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
