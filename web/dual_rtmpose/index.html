<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>fitra-cam RTMPose</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>fitra-cam RTMPose</h1>
    <div class="conn-group">
      <div id="conn" class="conn">2D connecting…</div>
      <div id="conn3d" class="conn">3D connecting…</div>
      <a class="conn link" href="/subject-calib">subject calib</a>
    </div>
  </header>
  <main>
    <!-- Panes are inserted dynamically by app.js as cameras report in. -->
  </main>
  <section id="view3d" class="view3d">
    <div class="view3d-head">
      <h2>3D</h2>
      <div class="view3d-tabs" role="group" aria-label="3D view">
        <button type="button" data-view="front" class="active">front</button>
        <button type="button" data-view="side">side</button>
        <button type="button" data-view="top">top</button>
      </div>
      <label class="view3d-toggle">
        <input type="checkbox" id="toggle-trackers" checked>
        <span>show trackers</span>
      </label>
    </div>
    <div class="canvas3d-wrap">
      <canvas id="canvas3d" width="640" height="480"></canvas>
      <div id="status3d" class="canvas-status">(no 3D data)</div>
    </div>
    <pre id="stats3d" class="stats">waiting…</pre>
    <div class="slimevr-corrections">
      <div class="slimevr-corrections-head">
        <h3>SlimeVR correction</h3>
        <button type="button" id="slimevr-reset-all">reset all</button>
        <span id="slimevr-correction-status">not loaded</span>
      </div>
      <table id="slimevr-corrections-table" class="trackers-table slimevr-table" aria-label="SlimeVR correction controls">
        <thead>
          <tr>
            <th>tracker</th>
            <th>yaw</th>
            <th>pitch</th>
            <th>roll</th>
            <th>reset</th>
          </tr>
        </thead>
        <tbody id="slimevr-corrections-tbody"></tbody>
      </table>
    </div>
    <table id="trackers-table" class="trackers-table" aria-label="tracker stats">
      <thead>
        <tr>
          <th>tracker</th>
          <th>state</th>
          <th>ang vel p50 (rad/s)</th>
          <th>ang vel p95</th>
          <th>conf avg</th>
          <th>leakage</th>
          <th>freeze</th>
          <th>freeze max (ms)</th>
          <th>dropouts</th>
        </tr>
      </thead>
      <tbody id="trackers-tbody"></tbody>
    </table>
  </section>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "OrbitControls": "./vendor/OrbitControls.js"
      }
    }
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
